name: Python CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/phase1-data-ingestion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src/legal_nlp

      - name: Run unit tests
        run: python -m pytest -q
